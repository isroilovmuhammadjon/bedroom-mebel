<style>
/* Layout: a bright showroom. Pale sage-white page, white working surfaces, deep brand green for every action; the live 3D room is the hero. */
:root{
  color-scheme:light;
  --bg:#F4F5F1; --surface:#FFFFFF; --surface2:#ECEFE9; --ink:#12201A; --ink2:#24332B; --muted:#4C5B52; --line:#D8DDD5; --line2:#BFC8BC;
  --green:#1E5B3E; --green-h:#164A31; --on-green:#FFFFFF; --green-soft:#E1ECE5; --ochre:#9C6420; --ochre-soft:#F4E7D3;
  --gold:#CBA265; --gold-ink:#8E6020; --deep:#12301F; --deep2:#24563F; --on-deep:#F4EFE4;
  --f-display:"Prata",Georgia,"Times New Roman",serif;
  --f-body:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink2);font:400 17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;overflow-x:hidden;font-variant-numeric:tabular-nums}
.wrap{max-width:1320px;margin-inline:auto;padding-inline:clamp(16px,3.5vw,40px)}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;color:var(--ink);text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--green);outline-offset:3px;border-radius:6px}
.eyebrow{font:700 13px/1.3 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--gold-ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:600 16px/1.1 var(--f-body);padding:15px 24px;border-radius:999px;border:1.5px solid transparent;text-decoration:none;cursor:pointer;transition:transform .2s,background .2s,border-color .2s,color .2s;text-align:center}
.btn:hover{transform:translateY(-2px)}
.btn-green{background:var(--green);color:var(--on-green)}
.btn-green:hover{background:var(--green-h)}
.btn-line{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.btn-line:hover{border-color:var(--ink)}

/* ---------- header + menu ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);box-shadow:0 6px 24px -20px rgba(18,32,26,.5)}
.bar{display:flex;align-items:center;gap:22px;height:72px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--green);flex:none}
.brand img{width:46px;height:auto;display:block}
.brand b{display:block;font:400 23px/1 var(--f-display);color:var(--ink)}
.brand small{display:block;font:700 10.5px/1 var(--f-body);letter-spacing:.36em;color:var(--gold-ink);margin-top:5px}
.nav-desk{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav-desk>a,.ddbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font:600 16px/1 var(--f-body);color:var(--ink2);padding:12px 14px;border-radius:999px;border:0;background:transparent;cursor:pointer;transition:background .2s,color .2s}
.nav-desk>a:hover,.ddbtn:hover{background:var(--surface2)}
.nav-desk>a.on,.ddbtn.on{color:var(--green);background:var(--green-soft)}
.ddbtn svg{width:12px;height:12px;transition:transform .2s}
.dd{position:relative}
.dd.open .ddbtn svg,.dd:hover .ddbtn svg{transform:rotate(180deg)}
.ddmenu{position:absolute;top:100%;left:0;min-width:240px;padding:8px;margin-top:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -18px rgba(18,32,26,.35);display:none;gap:2px}
.dd::after{content:"";position:absolute;left:0;right:0;top:100%;height:8px}
.dd:hover .ddmenu,.dd.open .ddmenu,.dd:focus-within .ddmenu{display:grid}
.ddmenu a{display:block;text-decoration:none;font:500 16px/1.2 var(--f-body);padding:12px 14px;border-radius:10px;color:var(--ink2)}
.ddmenu a:hover{background:var(--surface2)}
.ddmenu a.on{color:var(--green);background:var(--green-soft);font-weight:600}
.lang{display:flex;border:1px solid var(--line2);border-radius:999px;padding:3px;flex:none;background:var(--surface)}
.lang button{border:0;background:transparent;font:700 13.5px/1 var(--f-body);padding:9px 11px;border-radius:999px;cursor:pointer;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
.bar .btn{padding:12px 18px;font-size:15px}
.nav-mob{display:none;gap:8px;overflow-x:auto;padding:0 clamp(16px,3.5vw,40px) 12px;scrollbar-width:none;max-width:1320px;margin-inline:auto}
.nav-mob::-webkit-scrollbar{display:none}
.nav-mob a{flex:none;text-decoration:none;font:600 15px/1 var(--f-body);color:var(--ink2);padding:11px 15px;border-radius:999px;border:1px solid var(--line2);background:var(--surface)}
.nav-mob a.on{background:var(--green);border-color:var(--green);color:#fff}
@media (max-width:1060px){.nav-desk{display:none}.nav-mob{display:flex}.lang{margin-left:auto}}
@media (max-width:560px){.bar{height:62px;gap:12px}.bar .btn{display:none}.brand small{display:none}.brand b{font-size:21px}}

/* ---------- hero ---------- */
.heroband{position:relative;overflow:hidden;background:radial-gradient(120% 140% at 78% 30%,var(--deep2) 0%,var(--deep) 62%);color:var(--on-deep);margin-bottom:clamp(26px,3.5vw,44px)}
.heroband::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.7}
.intro{display:grid;grid-template-columns:1fr;gap:22px 56px;align-items:center;padding-block:clamp(34px,5vw,72px)}
@media (min-width:980px){.intro{grid-template-columns:1.25fr .75fr}}
.hero-lotus{width:100%;max-width:420px;height:auto;justify-self:center;filter:drop-shadow(0 18px 40px rgba(0,0,0,.35))}
@media (prefers-reduced-motion:no-preference){.hero-lotus{animation:lotusIn 1.4s cubic-bezier(.2,.8,.2,1) both}@keyframes lotusIn{from{opacity:0;transform:translateY(16px) scale(.96)}to{opacity:1;transform:none}}}
.heroband .eyebrow{color:var(--gold)}
.heroband h1{color:var(--on-deep)}
.btn-gold{background:var(--gold);color:#1A1206}
.btn-gold:hover{background:#D9B47A}
.btn-ghost-light{background:transparent;border-color:rgba(244,239,228,.45);color:var(--on-deep)}
.btn-ghost-light:hover{border-color:var(--on-deep)}
.intro h1{font-size:clamp(36px,4.8vw,68px);line-height:1.06;margin-top:14px}
.intro h1 em{font-style:normal;color:var(--gold)}
.intro p{color:rgba(244,239,228,.82);margin-top:16px;font-size:clamp(17px,1.5vw,19px);max-width:54ch}
.intro .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}

/* ---------- studio ---------- */
.studio{display:grid;grid-template-columns:1fr;border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--surface);box-shadow:0 30px 60px -40px rgba(18,32,26,.4)}
@media (min-width:980px){.studio{grid-template-columns:minmax(0,1fr) 420px;height:min(82vh,800px);min-height:620px}}
.viewport{position:relative;min-height:380px;height:60vh;background:linear-gradient(180deg,#EEF0EB,#E1E5DE)}
@media (min-width:980px){.viewport{height:auto}}
.viewport canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink2);font-size:16px;font-weight:500;padding:24px;transition:opacity .6s;background:linear-gradient(180deg,#EEF0EB,#E1E5DE)}
.loading .bar2{width:170px;height:3px;background:var(--line);margin:14px auto 0;overflow:hidden;border-radius:2px}
.loading .bar2 i{display:block;height:100%;width:40%;background:var(--green);animation:load 1.1s ease-in-out infinite}
@keyframes load{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.loading.done{opacity:0;pointer-events:none}
.vtools{position:absolute;top:14px;left:14px;right:340px;display:flex;flex-wrap:wrap;gap:8px;pointer-events:none}
.views{display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
.chip{border:1px solid var(--line2);background:rgba(255,255,255,.94);color:var(--ink);font:600 14px/1 var(--f-body);padding:10px 14px;border-radius:999px;cursor:pointer;transition:background .2s,border-color .2s;box-shadow:0 4px 14px -8px rgba(18,32,26,.4)}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.vtotal{position:absolute;top:14px;right:14px;pointer-events:auto;background:rgba(255,255,255,.96);border:1px solid var(--line2);border-radius:999px;padding:7px 7px 7px 16px;display:flex;align-items:center;gap:12px;font-size:14px;font-weight:500;color:var(--muted);box-shadow:0 4px 14px -8px rgba(18,32,26,.4)}
.vtotal b{font:700 16px/1 var(--f-body);color:var(--ink)}
.vtotal button{background:var(--green);color:#fff;border:0;border-radius:999px;font:600 14px/1 var(--f-body);padding:10px 15px;cursor:pointer}
.vhint{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);font-size:14px;font-weight:500;color:var(--ink2);background:rgba(255,255,255,.94);padding:9px 15px;border-radius:999px;white-space:nowrap;pointer-events:none;transition:opacity .8s;max-width:calc(100% - 32px);overflow:hidden;text-overflow:ellipsis;box-shadow:0 4px 14px -8px rgba(18,32,26,.4)}
.toast{position:absolute;left:50%;top:68px;transform:translate(-50%,-8px);background:var(--ink);color:#fff;font:600 14.5px/1.2 var(--f-body);padding:11px 17px;border-radius:999px;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:640px){
  .vtools{top:10px;left:10px;right:10px}
  .views{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;max-width:100%}
  .views::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:9px 12px;font-size:13.5px}
  .vtotal{top:auto;right:10px;bottom:10px;padding:6px 6px 6px 13px}
  .vhint{display:none}
}

.editbar,.edclose{display:none}
.wpup{display:grid;gap:12px}
.wpadd{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;border:2px dashed var(--gold);background:#FBF4E6;border-radius:16px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:background .2s,transform .2s}
.wpadd:hover{background:#F7EAD2;transform:translateY(-1px)}
.wpadd .plus{flex:none;width:54px;height:54px;border-radius:50%;background:var(--gold);color:#1A1206;display:grid;place-items:center;font:600 34px/1 var(--f-body);box-shadow:0 6px 16px -6px rgba(140,96,32,.7)}
.wpadd img{flex:none;width:54px;height:54px;border-radius:12px;object-fit:cover;border:2px solid var(--gold)}
.wpadd b{display:block;font:700 16.5px/1.25 var(--f-body);color:var(--ink)}
.wpadd span{display:block;font-size:14px;line-height:1.4;color:var(--muted);margin-top:3px}
@media (prefers-reduced-motion:no-preference){.wpadd .plus{animation:plusPulse 2.4s ease-in-out infinite}@keyframes plusPulse{0%,100%{box-shadow:0 0 0 0 rgba(203,162,101,.55)}50%{box-shadow:0 0 0 10px rgba(203,162,101,0)}}}
.sw.pat.addpat{border:2px dashed var(--gold);background:#FBF4E6;display:grid;place-items:center;font:600 30px/1 var(--f-body);color:var(--gold-ink)}
.chip.chip-add{background:var(--gold);border-color:var(--gold);color:#1A1206}
.chip.chip-add:hover{background:#D9B47A}
.wpup .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.wpup img{width:76px;height:76px;object-fit:cover;border-radius:10px;border:1px solid var(--line2)}
.wpup input[type=range]{width:100%;accent-color:var(--green);height:28px}
.wpup .rl{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.sw.pat{border-radius:10px;width:58px;height:58px;background-size:cover;background-position:center}
.sw.pat[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--green)}
.panel{display:flex;flex-direction:column;min-height:0;border-top:1px solid var(--line);background:var(--surface)}
@media (min-width:980px){.panel{border-top:0;border-left:1px solid var(--line)}}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line);flex:none;background:var(--surface)}
.tabs button{border:0;background:transparent;padding:18px 8px 16px;font:600 16px/1 var(--f-body);color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;transition:color .2s,border-color .2s}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tabs .count{display:inline-block;min-width:22px;font:700 12px/22px var(--f-body);background:var(--green);color:#fff;border-radius:11px;margin-left:6px;padding:0 6px}
.tabs .count:empty{display:none}
.tabbody{overflow:auto;flex:1;min-height:0;padding:20px 20px 28px;scrollbar-width:thin;scrollbar-color:var(--line2) transparent}
.group{display:grid;gap:11px;padding-block:16px;border-bottom:1px solid var(--line)}
.group:first-child{padding-top:0}
.group:last-child{border-bottom:0}
.group.flash{animation:flash 1.4s ease}
@keyframes flash{0%,100%{background:transparent}25%{background:var(--green-soft)}}
.glabel{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:700 15px/1.3 var(--f-body);color:var(--ink)}
.glabel span:last-child{font:500 14.5px/1.3 var(--f-body);color:var(--muted);text-align:right}
.seg{display:flex;flex-wrap:wrap;gap:7px}
.seg button{border:1.5px solid var(--line2);background:var(--surface);color:var(--ink2);font:500 15px/1.15 var(--f-body);padding:10px 14px;border-radius:999px;cursor:pointer;transition:all .2s}
.seg button:hover{border-color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--green);color:#fff;border-color:var(--green)}
.seg button:disabled{opacity:.4;cursor:not-allowed}
.seg.cats{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.seg.cats button{flex:none}
.sws{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:38px;height:38px;border-radius:50%;border:1px solid rgba(18,32,26,.18);background:var(--c);cursor:pointer;transition:transform .18s;padding:0}
.sw:hover{transform:scale(1.1)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px #fff,0 0 0 5.5px var(--green)}
.tip{font-size:14.5px;line-height:1.5;color:var(--ink2);background:var(--green-soft);border-radius:10px;padding:11px 13px;display:flex;gap:10px;align-items:flex-start}
.tip svg{flex:none;width:18px;height:18px;margin-top:2px;color:var(--green)}
.rail{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:var(--r);padding:0;cursor:pointer;overflow:hidden;transition:border-color .2s,transform .2s;display:flex;flex-direction:column}
.pc:hover{border-color:var(--line2);transform:translateY(-2px)}
.pc[aria-pressed="true"]{border-color:var(--green);box-shadow:inset 0 0 0 1px var(--green)}
.pc .img{aspect-ratio:4/3;max-width:100%;background:linear-gradient(180deg,#F8F9F6,#ECEFE9);display:grid;place-items:center}
.pc .img img{width:100%;height:100%;object-fit:contain}
.pc .meta{padding:10px 11px 12px;display:grid;gap:4px}
.pc b{font:700 15.5px/1.2 var(--f-body);color:var(--ink)}
.pc span{font:500 14px/1.2 var(--f-body);color:var(--muted)}
.pc .tick{position:absolute;top:8px;right:8px;width:24px;height:24px;border-radius:50%;background:var(--green);color:#fff;display:none;place-items:center;font-size:14px;font-weight:700}
.pc[aria-pressed="true"] .tick{display:grid}
.selhead{display:flex;justify-content:space-between;align-items:start;gap:12px}
.selhead h3{font-size:28px;line-height:1.05}
.selhead p{color:var(--muted);font-size:15px;margin-top:7px;line-height:1.5}
.selhead .price{font:700 18px/1.2 var(--f-body);white-space:nowrap;color:var(--green);text-align:right}
.selhead .price small{display:block;font:500 13px/1.4 var(--f-body);color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.acts .btn{padding:11px 16px;font-size:15px}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:15px;font-weight:500;cursor:pointer;padding:6px 2px}
.linkbtn:hover{color:var(--ink)}
.checks{display:grid;gap:8px}
.check{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;font-size:15.5px;font-weight:500;color:var(--ink2)}
.check:hover{border-color:var(--line2)}
.check input{width:19px;height:19px;margin:0;accent-color:var(--green)}
.check .pp{margin-left:auto;font:600 14px/1 var(--f-body);color:var(--muted)}
.empty{color:var(--muted);font-size:15.5px;padding:4px 0}
.ordlist{display:grid}
.ordrow{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15.5px}
.ordrow b{font-weight:700;color:var(--ink)}
.ordrow .pr{font-weight:600;color:var(--ink)}
.ordrow small{grid-column:1/-1;color:var(--muted);font-size:14px}
.ordtotal{display:flex;justify-content:space-between;align-items:baseline;padding:16px 0 4px;font-weight:700;color:var(--ink);font-size:17px}
.ordtotal .pr{font-size:23px;color:var(--green)}
.note{color:var(--muted);font-size:14.5px;line-height:1.5}
.field{display:grid;gap:7px;font-size:15px;font-weight:600;color:var(--ink);min-width:0}
.field input,.field textarea{font:400 16px/1.4 var(--f-body);color:var(--ink);background:#fff;border:1.5px solid var(--line2);border-radius:10px;padding:13px 14px;width:100%;transition:border-color .2s}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--green)}
.field textarea{resize:vertical;min-height:90px}
.out{display:grid;gap:10px;border:2px dashed var(--green);border-radius:12px;padding:14px;margin-top:4px;background:var(--green-soft)}
.out p{color:var(--ink);font-size:15px}
.out textarea{font:400 14.5px/1.5 var(--f-body)!important;min-height:160px}
.out .row{display:flex;flex-wrap:wrap;gap:8px}
.out .btn{padding:12px 16px;font-size:15px}
.err{color:#A3321B;font-size:15px;font-weight:500}

/* ---------- features ---------- */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0;margin-top:clamp(36px,5vw,56px);border-top:1px solid var(--line2)}
.feats div{padding:24px 24px 4px 0}

let LANG = (()=>{const s=ls.get('bm-lang');if(['uz','ru','en'].includes(s))return s;const n=(navigator.language||'').slice(0,2);return n==='ru'?'ru':n==='en'?'en':'uz';})();
const t = k => (T[k]&&(T[k][LANG]||T[k].uz))||k;
const L = o => o ? (o[LANG]||o.uz||'') : '';
const CUR = {uz:'so‘m',ru:'сум',en:'UZS'};
const money = n => !n ? t('price_ask') : Math.round(n).toLocaleString('ru-RU').replace(/ /g,' ') + ' ' + CUR[LANG];
const fromPrice = n => !n ? t('price_ask') : LANG==='uz' ? money(n)+'dan' : LANG==='ru' ? 'от '+money(n) : 'from '+money(n);
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CATS=['bed','nightstand','bench','wardrobe','dresser','desk'];
const LIVE=()=>PRODUCTS.filter(p=>!p.demo);
const ACTIVE_CATS=()=>CATS.filter(c=>LIVE().some(p=>p.cat===c));
const FILTERS=()=>{const a=[];ACTIVE_CATS().forEach(c=>{if(c==='bed'){if(LIVE().some(p=>p.cat==='bed'&&p.single))a.push('bed1');if(LIVE().some(p=>p.cat==='bed'&&!p.single))a.push('bed2');}else a.push(c);});return a;};
const inFilter=(p,f)=>f==='all'||(f==='bed1'?p.cat==='bed'&&p.single:f==='bed2'?p.cat==='bed'&&!p.single:p.cat===f);
const byId = Object.fromEntries(PRODUCTS.map(p=>[p.id,p]));
const CM={uz:'sm',ru:'см',en:'cm'};const cm=()=>CM[LANG];
const sizeLabel=(p,s)=> p.cat==='bed' ? `${s.w}×${s.l}` : `${s.w}×${s.d}×${s.h}`;

function defCfg(p){return {id:p.id,size:Math.min(1,p.sizes.length-1),finish:p.finishes[0],fabric:p.fabrics&&p.fabrics[0]||null,opts:[],place:'both'};}
const freshState=()=>({items:{bed:{...defCfg(byId.shahzoda),size:0},nightstand:{...defCfg(byId.qoraoyoq),size:0},bench:null,wardrobe:byId.antresol4?{...defCfg(byId.antresol4),size:0}:null,dresser:null,desk:null},room:{...ROOM_DEFAULT},layout:{},layoutName:'corner',layoutBase:'corner',picked:false});
let S=freshState();
try{const sv=JSON.parse(ls.get('bm-studio-v2')||'null');if(sv&&sv.items&&sv.room){const it={};CATS.forEach(c=>{const v=sv.items[c];it[c]=(v&&byId[v.id]&&byId[v.id].cat===c)?{...defCfg(byId[v.id]),...v,size:Math.min(v.size|0,byId[v.id].sizes.length-1)}:null;});S={items:it,room:{...ROOM_DEFAULT,...sv.room},layout:sv.layout||{},layoutName:sv.layoutName||'corner',layoutBase:sv.layoutBase||'corner',picked:!!sv.picked};}}catch(e){}
if(['stripes','geo'].includes(S.room.wallType)){S.room.paper=S.room.wallType;S.room.wallType='paper';}

let WALLPHOTO=null; /* uploaded wallpaper, kept only in this browser */
(()=>{const d=ls.get('bm-wallphoto');if(!d)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.width;c.height=im.height;c.getContext('2d').drawImage(im,0,0);WALLPHOTO=c;if(R&&S.room.wallType==='photo')buildWalls();if(curTab==='r')renderRoom();};im.src=d;})();
function itemPrice(c){if(!c)return 0;const p=byId[c.id];let n=p.sizes[c.size].price+(p.options||[]).filter(o=>c.opts.includes(o.id)).reduce((a,o)=>a+o.price,0);if(p.cat==='nightstand'&&c.place==='both')n*=2;return n;}

  if(!R)return;const m=MOODS[S.room.mood],v=R.moodV,from={...v},sc0=R.sun.color.clone(),sc1=col(m.sc);
  if(R.sky){if(R.sky.material.map)R.sky.material.map.dispose();R.sky.material.map=skyTexture(S.room.mood);R.sky.material.needsUpdate=true;}
  const ws=winSpec(),sunOn=ws?m.sun:m.sun*.25;R.scene.background.set(m.bg);

    R.scene.traverse(o=>{if(o.isMesh&&o.material&&'envMapIntensity'in o.material)o.material.envMapIntensity=o.material.userData.envFixed||v.env;if(o.isPointLight&&o.userData.lamp){const base=LAMP_BASE[o.userData.lamp]||1;o.intensity=o.userData.lamp==='led'?base*(.4+v.lamp*.6):base*v.lamp;}});MAT.shade.emissiveIntensity=v.lamp*.9;};

function slotsFor(cat){if(cat!=='nightstand')return [cat];const pl=S.items.nightstand?S.items.nightstand.place:'both';return pl==='both'?['nsL','nsR']:pl==='left'?['nsL']:['nsR'];}
function exitObj(o){if(!o)return Promise.resolve();FOLLOW.delete(o);const y0=o.position.y;return tween(320,k=>{o.scale.setScalar(Math.max(.001,1-k*.9));o.position.y=y0-k*.15;},easeIO).then(()=>{R.furn.remove(o);disposeObj(o);});}

  tween(720,k=>{g.position.y=(1-k)*1.1;},easeOut,delay);tween(620,k=>{g.scale.setScalar(Math.max(.001,.6+.4*k));},easeBack,delay);}

function placeCat(cat,{fresh:isNew=true}={}){
  if(!R)return;const c=S.items[cat];const slots=cat==='nightstand'?['nsL','nsR']:[cat];const want=c?slotsFor(cat):[];
  const olds={};slots.forEach(s=>{olds[s]=R.objs[s];R.objs[s]=null;});
  const news={};want.forEach(s=>{const g=buildProduct(byId[c.id],c);g.userData.slot=s;R.objs[s]=g;news[s]=g;});
  ensureLayout();
  if(cat==='bed')buildAccent();
  slots.forEach(s=>{const old=olds[s],g=news[s];
    if(g){if(isNew||!old){exitObj(old);enterObj(s,g,old?120:0);}
      else{const P=poseOf(s);g.userData.goal={x:P.x,z:P.z,ry:P.ry};g.position.set(old.position.x,0,old.position.z);g.rotation.y=old.rotation.y;R.furn.add(g);setGoal(g,P);const sx=Math.max(.5,Math.min(2,old.userData.w/g.userData.w));if(Math.abs(sx-1)>.01)tween(480,k=>{g.scale.set(sx+(1-sx)*k,1,1);},easeBack);FOLLOW.delete(old);R.furn.remove(old);disposeObj(old);}}

   THUMBNAILS — catalog images come from the same 3D models
   ====================================================================== */
let TR=null;const thumbCache=new Map();const tq=[];let tbusy=false;
const TW=coarse?640:720,TH=coarse?480:540;let thumbIdle=0;
/* Catalog images are drawn by the room's own 3D engine into an off-screen buffer.

const SRGB=new Uint8Array(256);for(let i=0;i<256;i++){const v=i/255;SRGB[i]=Math.round(255*(v<=.0031308?v*12.92:1.055*Math.pow(v,1/2.4)-.055));}
function initThumbs(){if(!R)return;const W2=TW*2,H2=TH*2;const s=new THREE.Scene();s.environment=R.scene.environment;s.background=new THREE.Color(.88,.9,.86);
  const key=new THREE.DirectionalLight('#FFF4E6',1.25);key.position.set(3,6,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);Object.assign(key.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:.5,far:20});s.add(key);s.add(new THREE.HemisphereLight('#ffffff','#b8a894',.25));
  const gr=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.ShadowMaterial({opacity:.2}));gr.rotation.x=-Math.PI/2;gr.receiveShadow=true;s.add(gr);
  const cam=new THREE.PerspectiveCamera(28,4/3,.05,50);const rt=new THREE.WebGLRenderTarget(W2,H2);
  const big=document.createElement('canvas');big.width=W2;big.height=H2;const out=document.createElement('canvas');out.width=TW;out.height=TH;
  TR={s,cam,rt,W2,H2,buf:new Uint8Array(W2*H2*4),big,out,key,gr};}
function releaseThumbs(){if(!TR||tbusy||tq.length)return;try{TR.rt.dispose();TR.key.shadow.map&&TR.key.shadow.map.dispose();}catch(e){}TR=null;}
function thumb(p,c){const key=`${p.id}|${c.size}|${c.finish}|${c.fabric}|${c.opts.join(',')}`;if(thumbCache.has(key))return Promise.resolve(thumbCache.get(key));if(!HAS3D||!MAT.ao||!R)return Promise.resolve('');return new Promise(res=>{tq.push({key,p,c,res});pump();});}

      const exp=r.toneMappingExposure;r.toneMappingExposure=.62;r.setRenderTarget(TR.rt);r.render(TR.s,TR.cam);r.readRenderTargetPixels(TR.rt,0,0,TR.W2,TR.H2,TR.buf);r.setRenderTarget(null);r.toneMappingExposure=exp;
      const W2=TR.W2,H2=TR.H2,ctx=TR.big.getContext('2d'),img=ctx.createImageData(W2,H2),d=img.data,b=TR.buf;
      for(let y=0;y<H2;y++){const src=(H2-1-y)*W2*4,dst=y*W2*4;for(let x=0;x<W2*4;x+=4){d[dst+x]=SRGB[b[src+x]];d[dst+x+1]=SRGB[b[src+x+1]];d[dst+x+2]=SRGB[b[src+x+2]];d[dst+x+3]=255;}}
      ctx.putImageData(img,0,0);const o=TR.out.getContext('2d');o.imageSmoothingEnabled=true;o.imageSmoothingQuality='high';o.drawImage(TR.big,0,0,TW,TH);url=TR.out.toDataURL('image/jpeg',.86);
      TR.s.remove(g);disposeObj(g);if(R.invalidate)R.invalidate(2);}}catch(e){console.warn(e);}thumbCache.set(j.key,url);j.res(url);tbusy=false;pump();},coarse?40:16);}

function tgSend(a,text,e){
  /* 1) the order goes to our server, which forwards it to the shop's Telegram through the bot; the customer stays on the page.
     2) if the server cannot be reached, the next tap opens the shop's Telegram chat with the text ready (and copied). */
  const link='https://t.me/'+BRAND.orders+'?text='+encodeURIComponent(text.slice(0,3500));
  if(BRAND.api&&!a.dataset.manual){
    if(e)e.preventDefault();if(a.dataset.busy)return;a.dataset.busy='1';const label=a.textContent;a.textContent=t('sending');
    const ctl='AbortController'in window?new AbortController():null;const tm=setTimeout(()=>ctl&&ctl.abort(),15000);
    fetch(BRAND.api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({m:text.slice(0,3900),l:LANG}),signal:ctl?ctl.signal:undefined}).then(r=>r.json())
      .then(js=>{if(!js.ok)throw 0;a.textContent=label;orderDone(a);})
      .catch(()=>{a.href=link;a.dataset.manual='1';a.textContent=t('send_tg');gToast(t('bot_fail'));})
      .finally(()=>{clearTimeout(tm);delete a.dataset.busy;});
    return;}
  a.href=link;try{navigator.clipboard.writeText(text).catch(()=>{});}catch(err){}gToast(t('sent_hint'));}
function copy(text,btn,el){const orig=btn.textContent;const ok=()=>{btn.textContent=t('copied');setTimeout(()=>btn.textContent=orig,1800);};const fb=()=>{if(el){if(el.select)el.select();else{const rg=document.createRange();rg.selectNodeContents(el);const s=getSelection();s.removeAllRanges();s.addRange(rg);}}btn.textContent=t('selected');};try{navigator.clipboard.writeText(text).then(ok,fb);}catch(e){fb();}}

    const img=card.querySelector('img');const draw=()=>thumbFor(p,{...defCfg(p),size:0,finish:st.finish,fabric:st.fabric}).then(u=>{if(u&&img.getAttribute('src')!==u){img.style.opacity=.35;img.onload=()=>img.style.opacity=1;img.onerror=img.onload;img.src=u;}});if(lazyIO){card._draw=draw;lazyIO.observe(card);}else draw();

function putInRoom(p,st){const prev=S.items[p.cat];S.items[p.cat]={...defCfg(p),finish:st&&st.finish||p.finishes[0],fabric:st&&st.fabric||(p.fabrics&&p.fabrics[0])||null,place:prev?prev.place:'both'};if(st&&st.size!=null)S.items[p.cat].size=st.size;S.picked=true;save();curCat=p.cat;showView('room');setTab('f');renderFurniture();renderOrder();setTimeout(()=>{placeCat(p.cat,{fresh:true});renderFurniture();setTimeout(()=>p.cat==='bed'?goView('all'):focusCat(p.cat),400);toast(`${L(p.name)}: ${t('placed')}`);},reduce?0:650);}
/* 3D product viewer: the one WebGL canvas moves into the product window while it is open */
let PV=null;
function initPV(){const s=new THREE.Scene();s.environment=R.scene.environment;s.background=new THREE.Color('#EEF1EC');
  const key=new THREE.DirectionalLight('#FFF4E6',1.3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0004;key.shadow.normalBias=.02;s.add(key);s.add(key.target);
  s.add(new THREE.HemisphereLight('#ffffff','#b8a894',.3));const fill=new THREE.DirectionalLight('#ffffff',.25);fill.position.set(-3,2,-2);s.add(fill);
  const floor=new THREE.Mesh(new THREE.CircleGeometry(4,64),new THREE.MeshStandardMaterial({color:'#E4E8E1',roughness:.95}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;s.add(floor);
  const cam=new THREE.PerspectiveCamera(32,4/3,.05,60);const ctl=new THREE.OrbitControls(cam,R.canvas);ctl.enabled=false;ctl.enableDamping=true;ctl.dampingFactor=.08;ctl.enablePan=false;ctl.minPolarAngle=.15;ctl.maxPolarAngle=1.48;ctl.autoRotateSpeed=1.4;ctl.rotateSpeed=.8;
  ctl.addEventListener('start',()=>{ctl.autoRotate=false;const h=$('pdHint');if(h)h.style.opacity=0;});
  PV={s,cam,ctl,key,floor,obj:null,ro:null};R_setTouch();}
function pvResize(host){const w=host.clientWidth,h=host.clientHeight;if(!w||!h)return;R.renderer.setSize(w,h,false);PV.cam.aspect=w/h;PV.cam.updateProjectionMatrix();}
function pvSetModel(p,c,keepView){if(!PV)return;if(PV.obj){PV.s.remove(PV.obj);disposeObj(PV.obj);}
  const g=buildProduct(p,c);g.traverse(o=>{if(o.isMesh&&o.material&&'envMapIntensity'in o.material)o.material.envMapIntensity=o.material.userData.envFixed||.6;});PV.s.add(g);PV.obj=g;
  const box=new THREE.Box3().setFromObject(g),ctr=box.getCenter(new THREE.Vector3()),sz=box.getSize(new THREE.Vector3()),rad=sz.length()/2;
  const dist=rad/Math.sin(THREE.MathUtils.degToRad(PV.cam.fov/2))*1.02;
  const cur=PV.cam.position.distanceTo(PV.ctl.target);const ok=keepView&&cur>rad*.9&&isFinite(cur);
  const dir=ok?PV.cam.position.clone().sub(PV.ctl.target).normalize():new THREE.Vector3(.85,.5,1).normalize();const d=ok?Math.min(Math.max(cur,rad*1.1),dist*1.6):dist;
  PV.ctl.target.set(ctr.x,ctr.y*.92,ctr.z);PV.cam.position.copy(PV.ctl.target).add(dir.multiplyScalar(d));
  PV.ctl.minDistance=rad*1.05;PV.ctl.maxDistance=rad*4;PV.floor.scale.setScalar(Math.max(1,rad*.8));
  PV.key.position.set(ctr.x+rad*1.5,rad*3,ctr.z+rad*2);PV.key.target.position.copy(ctr);Object.assign(PV.key.shadow.camera,{left:-rad*1.5,right:rad*1.5,top:rad*1.5,bottom:-rad*1.5,near:.1,far:rad*8});PV.key.shadow.camera.updateProjectionMatrix();PV.ctl.update();}
function pvOpen(host,p,c){if(!R||!HAS3D)return false;try{if(!PV)initPV();R.mode='product';R.renderer.setPixelRatio(Math.min(devicePixelRatio||1,2.5));host.prepend(R.canvas);R.controls.enabled=false;PV.ctl.enabled=true;PV.ctl.autoRotate=!reduce;R.canvas.style.touchAction='none';R.canvas.style.cursor='';pvResize(host);PV.ro=new ResizeObserver(()=>pvResize(host));PV.ro.observe(host);pvSetModel(p,c,false);return true;}catch(e){console.warn(e);pvClose();return false;}}
function pvClose(){if(!PV||!R||R.mode!=='product'||$('pd').open)return;if(PV.ro)PV.ro.disconnect();PV.ctl.enabled=false;R.mode=null;R.renderer.setPixelRatio(R_DPR);R.vp.prepend(R.canvas);R.controls.enabled=true;R_setTouch();R.fit&&R.fit(true);if(PV.obj){PV.s.remove(PV.obj);disposeObj(PV.obj);PV.obj=null;}R.invalidate&&R.invalidate(5);}
function pvDoors(btn){const g=PV&&PV.obj;if(!g||!g.userData.doors)return;const open=!g.userData.open;g.userData.open=open;g.userData.doors.forEach((d,i)=>{const from=d.kind==='rot'?d.o.rotation.y:d.o.position.x,to=d.kind==='rot'?(open?d.open:0):(open?d.base+d.open:d.base);tween(900,k=>{if(d.kind==='rot')d.o.rotation.y=from+(to-from)*k;else d.o.position.x=from+(to-from)*k;},easeIO,i*90);});if(btn)btn.textContent=open?t('doors_close'):t('doors_open');}
$('pd').addEventListener('close',pvClose);
function openProduct(p){
  const st={...(cardFin[p.id]||{finish:p.finishes[0],fabric:p.fabrics&&p.fabrics[0]||null}),size:0};const dlg=$('pd');const img=$('pdImg');

  const redraw=(keep=true)=>{if(is3d){pvSetModel(p,cfg(),keep);return;}thumbFor(p,cfg()).then(u=>{if(u)img.src=u;});};
  const info=$('pdInfo');

    const fg=document.createElement('div');fg.className='sws';p.finishes.forEach(f=>fg.append(sw(FINISHES[f].hex,L(FINISHES[f].name),f===st.finish,()=>{st.finish=f;render();redraw();})));info.append(group(t('finish'),L(FINISHES[st.finish].name),fg));
    if(p.fabrics&&p.fabrics.length){const fb=document.createElement('div');fb.className='sws';p.fabrics.forEach(f=>fb.append(sw(FABRICS[f].hex,L(FABRICS[f].name),f===st.fabric,()=>{st.fabric=f;render();redraw();})));info.append(group(t('fabric'),L(FABRICS[st.fabric].name),fb));}
    if(p.options&&p.options.length){const ol=document.createElement('p');ol.className='desc';ol.textContent=p.options.map(o=>`${L(o.name)}: +${money(o.price)}`).join(' · ');info.append(group(t('options'),'',ol));}
    const btns=document.createElement('div');btns.className='btns';btns.innerHTML=`<button class="btn btn-green" type="button">${t('in_room')}</button>`;btns.querySelector('button').onclick=()=>{dlg.close();putInRoom(p,st);};if(is3d&&p.cat==='wardrobe'){const db=document.createElement('button');db.type='button';db.className='btn btn-line';db.textContent=PV&&PV.obj&&PV.obj.userData.open?t('doors_close'):t('doors_open');db.onclick=()=>pvDoors(db);btns.append(db);}info.append(btns);
    info.querySelectorAll('input[name="pdsize"]').forEach(r=>r.onchange=()=>{st.size=+r.value;redraw();});};
  const stage=$('pdStage');img.removeAttribute('src');img.alt=L(p.name);stage.hidden=false;img.hidden=true;dlg.showModal();
  is3d=pvOpen(stage,p,cfg());if(!is3d){stage.hidden=true;img.hidden=false;redraw();}else{const h=$('pdHint');h.textContent=t(coarse?'pd_hint_touch':'pd_hint');h.style.opacity=1;}
  render();
}
