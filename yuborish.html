<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bedroom Mebel — buyurtma</title>
<meta name="robots" content="noindex">
<style>
:root{--deep:#12301F;--green:#1E5B3E;--gold:#CBA265;--cream:#F4EFE4;--ink:#12201A;--muted:#4C5B52}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100svh;display:grid;place-items:center;background:var(--deep);color:var(--cream);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:24px 16px}
.card{width:min(440px,100%);background:#fff;color:var(--ink);border-radius:22px;padding:32px 26px;text-align:center;box-shadow:0 30px 60px -30px rgba(0,0,0,.6)}
.logo{width:64px;height:64px;margin:0 auto 18px;display:block}
h1{font-size:24px;line-height:1.2;margin:0 0 10px}
p{margin:0 0 6px;color:var(--muted)}
.spin{width:42px;height:42px;border-radius:50%;border:4px solid #E1ECE5;border-top-color:var(--green);margin:8px auto 18px;animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.ok{width:58px;height:58px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:32px;margin:6px auto 16px}
.btn{display:inline-block;margin-top:18px;padding:14px 22px;border-radius:999px;background:var(--green);color:#fff;text-decoration:none;font-weight:600}
.btn.line{background:#fff;color:var(--ink);border:1.5px solid #BFC8BC;margin-left:6px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="card">
  <svg class="logo" viewBox="0 0 200 200" aria-hidden="true"><rect width="200" height="200" rx="48" fill="#12301F"/><g transform="translate(-10 -1)"><path d="M64 50V152H156V110L110 72L64 110" fill="none" stroke="#F4EFE4" stroke-width="24" stroke-linejoin="round" stroke-linecap="round"/><rect x="102" y="114" width="16" height="26" rx="2" fill="#CBA265"/></g></svg>
  <div id="busy"><div class="spin"></div><h1 data-t="busy">Buyurtma yuborilmoqda…</h1></div>
  <div id="done" hidden><div class="ok">✓</div><h1 data-t="done">Buyurtma yuborildi</h1><p data-t="thanks">Rahmat! Tez orada siz bilan bog‘lanamiz.</p><a class="btn" id="back" href="#" data-t="back">Saytga qaytish</a></div>
  <div id="fail" hidden><h1 data-t="fail">Yuborib bo‘lmadi</h1><p data-t="failp">Internetni tekshirib, qayta urinib ko‘ring yoki bizga Telegramda yozing.</p><a class="btn" id="retry" href="#" data-t="retry">Qayta urinish</a><a class="btn line" id="tg" href="https://t.me/Shaxriyor723" data-t="tg">Telegramda yozish</a></div>
  <div id="empty" hidden><h1 data-t="empty">Buyurtma topilmadi</h1><a class="btn" href="/bedroom-mebel/" data-t="back">Saytga qaytish</a></div>
</main>
<script>
/* Receives the order text in the link (#...) from the Bedroom Mebel site and sends it to the team through the Telegram bot. */
const BOT='8729439935:AAGSF3FS8R4SR0a_i4ioqX-WM3K4CfUG3C8';
const CHATS=['8149887672','1388062014','1977082720'];
const T={
 uz:{busy:'Buyurtma yuborilmoqda…',done:'Buyurtma yuborildi',thanks:'Rahmat! Tez orada siz bilan bog‘lanamiz.',back:'Saytga qaytish',fail:'Yuborib bo‘lmadi',failp:'Internetni tekshirib, qayta urinib ko‘ring yoki bizga Telegramda yozing.',retry:'Qayta urinish',tg:'Telegramda yozish',empty:'Buyurtma topilmadi',head:'Saytdan yangi buyurtma'},
 ru:{busy:'Отправляем заказ…',done:'Заказ отправлен',thanks:'Спасибо! Мы скоро свяжемся с вами.',back:'Вернуться на сайт',fail:'Не удалось отправить',failp:'Проверьте интернет и попробуйте снова или напишите нам в Telegram.',retry:'Попробовать снова',tg:'Написать в Telegram',empty:'Заказ не найден',head:'Новый заказ с сайта'},
 en:{busy:'Sending your order…',done:'Order sent',thanks:'Thank you! We will contact you soon.',back:'Back to the website',fail:'Could not send',failp:'Check your connection and try again, or message us on Telegram.',retry:'Try again',tg:'Message on Telegram',empty:'No order found',head:'New order from the website'}};
const q=new URLSearchParams(location.search.length>1?location.search.slice(1):location.hash.slice(1));
/* new links carry the order in the path: /bedroom-mebel/b/<lang>/<base64url> (survives in-app browsers that drop ?query and #hash) */
const pm=location.pathname.match(/\/b\/(uz|ru|en)\/([A-Za-z0-9_-]+)\/?$/);
let pmsg=null;if(pm){try{const bin=atob(pm[2].replace(/-/g,'+').replace(/_/g,'/'));pmsg=new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));}catch(e){}}
const lang=T[pm&&pm[1]]?pm[1]:T[q.get('l')]?q.get('l'):'uz',t=T[lang];
document.documentElement.lang=lang;
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t[e.dataset.t]);
const back=q.get('b');if(back&&/^https:\/\//.test(back))document.getElementById('back').href=back;else document.getElementById('back').href='/bedroom-mebel/';
const msg=pmsg||q.get('m');
const show=id=>['busy','done','fail','empty'].forEach(k=>document.getElementById(k).hidden=k!==id);
const key='bm-sent-'+(msg?msg.length+':'+msg.slice(0,40):'');
function send(){
  show('busy');
  Promise.all(CHATS.map(id=>fetch('https://api.telegram.org/bot'+BOT+'/sendMessage',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:id,text:'🛏 '+t.head+'\n\n'+msg.slice(0,3900)})}).then(r=>r.json()).catch(()=>({ok:false}))))
   .then(rs=>{if(rs.some(r=>r.ok)){try{sessionStorage.setItem(key,'1')}catch(e){}show('done');history.replaceState(null,'','/bedroom-mebel/b/?l='+lang);}else show('fail');});
}
if(!msg)show('empty');
else{let sent=false;try{sent=sessionStorage.getItem(key)==='1'}catch(e){}if(sent)show('done');else send();}
document.getElementById('retry').onclick=e=>{e.preventDefault();send();};
</script>
</body>
</html>
